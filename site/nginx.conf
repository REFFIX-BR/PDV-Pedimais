server {
  listen 80;
  server_name pdv.reffix.com.br;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location = / {
    try_files /site.html =404;
  }

  location = /precos {
    try_files /site.html =404;
  }

  location = /precos/ {
    try_files /site.html =404;
  }

  location = /site {
    try_files /site.html =404;
  }

  location = /site/ {
    try_files /site.html =404;
  }

  location = /site/precos {
    try_files /site.html =404;
  }

  location = /site/precos/ {
    try_files /site.html =404;
  }

  location / {
    try_files $uri =404;
    expires 7d;
  }
}
