# Stack do site para Docker Swarm.
# O script site/deploy.sh constrói a imagem e publica esta stack
# na rede do Traefik que já está no servidor.

services:
  site:
    image: ${IMAGE:-pdv-pedimais-site:latest}
    pull_policy: missing
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${SWARM_NODE}
      update_config:
        order: start-first
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
        - traefik.http.routers.pdv-site.rule=Host(`pdv.reffix.com.br`)
        - traefik.http.routers.pdv-site.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.pdv-site.tls=true
        - traefik.http.routers.pdv-site.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
        - traefik.http.routers.pdv-site.service=pdv-site
        - traefik.http.services.pdv-site.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
